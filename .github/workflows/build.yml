name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ContactGrid-${GITHUB_RUN_NUMBER}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.1.${GITHUB_RUN_NUMBER}
          gh release create "$TAG" out/*.apk --title "ContactGrid $TAG" --notes "Сборка из main, коммит ${GITHUB_SHA::7}"
